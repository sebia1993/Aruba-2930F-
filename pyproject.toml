[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aruba2930f-config-backup"
version = "0.1.7"
description = "Secure Windows GUI for batch Aruba 2930F running-config backups over SSH"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
authors = [{ name = "sebia1993" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: System Administrators",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Networking",
]
dependencies = [
  "netmiko==4.6.0",
  "paramiko==4.0.0",
  "openpyxl==3.1.5",
  "PySide6==6.11.0",
]

[project.scripts]
aruba2930f-backup = "aruba2930f_backup.__main__:main"
aruba2930f-diagnose = "aruba2930f_backup.diagnostics:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "gui: tests that require a Qt application",
  "integration: loopback-only integration tests",
]

[tool.coverage.run]
branch = true
source = ["aruba2930f_backup"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["aruba2930f_backup"]
warn_unused_ignores = true
exclude = ["build", "dist"]

[[tool.mypy.overrides]]
module = ["netmiko.*", "openpyxl.*", "PySide6.*"]
ignore_missing_imports = true
