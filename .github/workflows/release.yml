name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-build:
    name: Verify tag and build Windows assets
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Check out tagged commit with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.14 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lock.txt
            requirements-dev.txt

      - name: Require a version tag on the current main commit
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH: $env:RELEASE_TAG"
          }
          $tagType = git cat-file -t "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0 -or $tagType.Trim() -ne "tag") {
            throw "Release tag must be an annotated Git tag: $env:RELEASE_TAG"
          }
          git fetch --no-tags origin main
          if ($LASTEXITCODE -ne 0) {
            throw "Could not fetch origin/main for the release gate."
          }
          $tagCommit = git rev-parse "$env:RELEASE_TAG^{commit}"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not resolve the release tag commit."
          }
          $mainCommit = git rev-parse "origin/main^{commit}"
          if ($LASTEXITCODE -ne 0 -or $tagCommit.Trim() -ne $mainCommit.Trim()) {
            throw "Release tag must point to the current origin/main commit."
          }
          python tools/check_version.py --tag $env:RELEASE_TAG

      - name: Install locked runtime and development tools
        shell: pwsh
        run: |
          python -m pip install --no-input pip==26.2.1 setuptools==84.0.0
          python -m pip install --no-input -r requirements-lock.txt -r requirements-dev.txt
          python -m pip install --no-input --no-deps -e .

      - name: Run release validation gates
        shell: pwsh
        run: ./tools/validate.ps1 -PythonPath python

      - name: Build and verify exact release assets
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          ./build_windows.ps1 -PythonPath python -Version $version -SkipValidation -UseCurrentEnvironment

      - name: Retain verified assets in the workflow run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Aruba2930FConfigBackup-${{ github.ref_name }}-windows-x64
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 30

  publish-prerelease:
    name: Publish verified prerelease assets
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Download verified assets only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Aruba2930FConfigBackup-${{ github.ref_name }}-windows-x64
          path: artifacts/release

      - name: Create GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "GitHub release already exists and will not be overwritten: $env:RELEASE_TAG"
          }
          $version = $env:RELEASE_TAG.Substring(1)
          $releaseRoot = Join-Path $PWD "artifacts/release"
          $zip = Join-Path $releaseRoot "Aruba2930FConfigBackup_v${version}_windows_x64.zip"
          $sha256 = "$zip.sha256"
          $sbom = Join-Path $releaseRoot "Aruba2930FConfigBackup_v${version}_sbom.cdx.json"
          $notes = Join-Path $releaseRoot "release-notes-v${version}.md"
          gh release create $env:RELEASE_TAG $zip $sha256 $sbom `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --prerelease `
            --title "Aruba 2930F Config Backup v${version}" `
            --notes-file $notes
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub prerelease creation failed."
          }
