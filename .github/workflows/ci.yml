name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-validate-and-package:
    name: Windows x64 validation and package
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lock.txt
            requirements-dev.txt

      - name: Install locked runtime and development tools
        shell: pwsh
        run: |
          python -m pip install --no-input pip==26.2.1 setuptools==84.0.0
          python -m pip install --no-input -r requirements-lock.txt -r requirements-dev.txt
          python -m pip install --no-input --no-deps -e .

      - name: Run safety, lint, typing, tests, coverage, and audit
        shell: pwsh
        run: ./tools/validate.ps1 -PythonPath python

      - name: Build and verify portable package
        shell: pwsh
        run: ./build_windows.ps1 -PythonPath python -Version 0.1.1 -SkipValidation -UseCurrentEnvironment

      - name: Upload verified CI package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Aruba2930FConfigBackup-windows-x64-ci
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 7
