name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-validate-and-package:
    name: Windows x64 validation and package
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14 x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lock.txt
            requirements-dev.txt

      - name: Install locked runtime and development tools
        shell: pwsh
        run: |
          python -m pip install --no-input pip==26.2.1 setuptools==84.0.0
          if ($LASTEXITCODE -ne 0) { throw "Bootstrap tool installation failed." }
          python -m pip install --no-input -r requirements-lock.txt -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw "Locked dependency installation failed." }
          python -m pip install --no-input --no-deps -e .
          if ($LASTEXITCODE -ne 0) { throw "Editable package installation failed." }

      - name: Run safety, lint, typing, tests, coverage, and audit
        shell: pwsh
        run: ./tools/validate.ps1 -PythonPath python

      - name: Render documentation screenshots
        shell: pwsh
        run: |
          $fontBlobSha = 'b386890ba945e1f39448a6b59f20c5d194f58808'
          $fontApi = "https://api.github.com/repos/google/fonts/git/blobs/$fontBlobSha"
          $headers = @{
            Accept = 'application/vnd.github+json'
            'User-Agent' = 'Aruba2930FConfigBackup-CI'
          }
          $fontBlob = Invoke-RestMethod -Uri $fontApi -Headers $headers
          if ($fontBlob.sha -ne $fontBlobSha -or $fontBlob.encoding -ne 'base64') {
            throw 'Pinned Noto Sans KR blob verification failed.'
          }
          $fontPath = Join-Path $env:RUNNER_TEMP 'NotoSansKR.ttf'
          $fontBytes = [Convert]::FromBase64String(($fontBlob.content -replace '\s', ''))
          [IO.File]::WriteAllBytes($fontPath, $fontBytes)
          if ((Get-Item -LiteralPath $fontPath).Length -ne 10414588) {
            throw 'Pinned Noto Sans KR font size verification failed.'
          }
          $env:DOCS_FONT_PATH = $fontPath
          python tools/render_docs_screenshots.py --output artifacts/docs-screenshots
          if ($LASTEXITCODE -ne 0) { throw "Documentation screenshot rendering failed." }

      - name: Upload documentation screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Aruba2930FConfigBackup-docs-screenshots
          path: artifacts/docs-screenshots/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Build and verify portable package
        shell: pwsh
        run: ./build_windows.ps1 -PythonPath python -Version 0.1.8 -SkipValidation -UseCurrentEnvironment

      - name: Upload verified CI package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Aruba2930FConfigBackup-windows-x64-ci
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 7
