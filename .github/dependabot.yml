version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      python-runtime:
        patterns:
          - "netmiko"
          - "paramiko"
          - "PySide6*"
          - "shiboken6"
          - "openpyxl"
      python-tooling:
        dependency-type: development
        patterns:
          - "*"
    labels:
      - dependencies
      - python

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
